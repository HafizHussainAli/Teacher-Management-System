<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>

        /* Navigation Bar */
        .navbar {
            background: linear-gradient(70deg, rgb(15, 15, 137), rgb(56, 140, 224));
            padding: 10px;
            font-size: 20px;
            font-family: Cambria, Cochin, Georgia, Times, serif;
        }

        /* Navigation List */
        .nav-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* Navigation Items */
        .nav-item {
            display: inline-block;
            margin-right: 50px;
        }

        /* Navigation Links */
        .nav-link {
            color: white;
            text-decoration: none;
        }

        /* Hover Effect */
        .nav-link:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <nav class="navbar">

        <ul class="nav-list">

            <li class="nav-item">
                <a href="#home" class="nav-link">Home</a>
            </li>

            <li class="nav-item">
                <a href="#Procedure" class="nav-link">Procedure</a>
            </li>

            <li class="nav-item">
                <a href="#contact" class="nav-link">Contact</a>
            </li>

            <li class="nav-item">
                <a href="#about" class="nav-link">About</a>
            </li>

        </ul>

    </nav>

</body>
</html>
